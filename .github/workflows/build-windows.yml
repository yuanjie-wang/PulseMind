# Windows/x64 portable 打包。
#
# 目标：产出免安装 .exe（build.win.target = portable），并让它**装机即能启动**。
# 2026-10-14 的 0.4.2 win portable 曾「装完就崩 Cannot find module
# 'archiver-utils'」——那是 two packing bugs（平台段 files 全否定触发 `**/*`
# 全捕获 + Go 依赖树静默丢包），已在 package.json 与 afterPack 门禁里修掉；
# 本 workflow 因此**不重做那层检查**，而是把「跑完 electron-builder 不等于产物
# 能用」这件事换成三条显式断言（见 Package 之后的步骤）。
#
# 为什么不在 mac 上交叉打：win 的 portable 目标走 NSIS，非 Windows 宿主需要
# wine（本仓开发机实测没有 wine）。GitHub 的 windows runner 免掉这层。
#
# 与 build-linux.yml 的三处刻意差异：
#   · **不设 npm_config_build_from_source**：那条旗是为 glibc 天花板钉的，
#     Windows 不存在这个问题。better-sqlite3 的 win32-x64 prebuild 与 Electron
#     33 的 ABI 对得上，让 prebuild-install 直接取，省掉 MSVC 编译时间。
#     万一 prebuild 缺席，node-gyp 会回落编译，windows-latest 自带 VS Build Tools。
#   · **不设 PLAYWRIGHT_HOST_PLATFORM_OVERRIDE**：Linux 那边是因为 runner 发行
#     版被 Playwright 从支持矩阵里摘了才 override；Windows 是原生支持的一格。
#   · 架构只出 x64：win.extraResources 的 filter 是 `win32-${arch}/**`，而
#     resources/bin 只有 win32-x64（arm64 缺 rg 会静默降级成 grep 兜底）。
#
# 原生模块的 ABI 由 `npm ci` 的 postinstall 保证：scripts 里有
# `postinstall: electron-builder install-app-deps`，它按 devDependencies 的
# electron 版本重建 —— 所以 build 配置里的 npmRebuild:false 不影响这里。

name: Build Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: win/x64 portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      # 对齐 build-linux.yml 的 node 20（两者产出同一个版本的 asar 形态）。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-win-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      # node_modules 必须来自干净安装：afterPack 的 verify-packed-node-modules
      # 门禁要求纯安装树（AGENTS.md「打包两刀」），不要在 CI 里缓存它。
      # postinstall 会跑 electron-builder install-app-deps，原生模块在这一步
      # 就按 Electron 33 的 ABI 重建成 win32-x64。
      - name: Install dependencies
        run: npm ci

      - name: Assert native modules target Electron+win32
        shell: pwsh
        run: |
          $node_exe = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (-not (Test-Path $node_exe)) { throw "better-sqlite3 二进制缺失 —— postinstall 的重建没跑成" }
          # 头部 MZ 即 Windows PE；ELF/Mach-O 说明装进了一个别的平台的产物
          $magic = [System.IO.File]::ReadAllBytes((Resolve-Path $node_exe))[0..1]
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "better_sqlite3.node 不是 PE 格式（magic=$($magic -join ','))" }
          Get-Item $node_exe | Select-Object Length, FullName | Format-List
          $sharp = Get-ChildItem "node_modules\@img" -Directory | Where-Object { $_.Name -like '*win32*' }
          if (-not $sharp) { throw "sharp 的 win32 变体没装上（@img 下只有 $((Get-ChildItem node_modules\@img -Directory).Name -join ', ')）—— 图片链路会在运行期崩" }
          $sharp | ForEach-Object { Write-Host "sharp variant: $($_.Name)" }
          $ort = "node_modules\onnxruntime-node\bin\napi-v6\win32\x64\onnxruntime_binding.node"
          if (-not (Test-Path $ort)) { throw "onnxruntime-node 的 win32/x64 二进制缺失 —— OCR 不可用" }
          Get-Item $ort | Select-Object Length | Format-List

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的契约是「永不非零退出」（缺了只 warn，让没有
      # Chromium 的开发机也能打包），代价是任何取浏览器失败都会静默变成
      # 「一个没有内置浏览器的包」。CI 里没有这个让步的必要。
      # ensure-chromium 会把 chrome-win64 归一化成 chrome-win（名字对齐
      # ManagedBackend 的期待），所以断言的是归一化后的目录。
      - name: Verify bundled Chromium landed
        shell: pwsh
        run: |
          $chrome = "resources\chromium\chrome-win\chrome.exe"
          if (-not (Test-Path $chrome)) {
            Write-Host "::error::$chrome missing — ensure-chromium never fails, so this step is the only browser-less-package gate"
            if (Test-Path resources\chromium) { Get-ChildItem resources\chromium -Recurse -Depth 2 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName } }
            exit 1
          }
          Get-Item $chrome | Select-Object Length | Format-List

      - name: Package portable exe
        run: npx electron-builder --win portable --x64 --publish never

      # 「electron-builder 退出码 0」不等于「产物能用」——0.4.2 那次就是这么发出去的。
      # 三条断言对应三个曾经/可能真出事的点：依赖树完整性（afterPack 门禁已跑，
      # 这里复核 win-unpacked 真的产出了）、OCR 模型随包（extraResources 的模型是
      # 全局段，不依赖平台 filter，但值得钉住）、ORT 只剩本平台（剥完应只有 win32）。
      - name: Assert packaged tree is usable
        shell: pwsh
        run: |
          $unpacked = "dist\win-unpacked"
          if (-not (Test-Path $unpacked)) { throw "dist\win-unpacked 不存在" }
          $asar = Join-Path $unpacked "resources\app.asar"
          if (-not (Test-Path $asar)) { throw "app.asar 缺失" }
          Write-Host ("app.asar: {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

          # OCR 模型走全局 extraResources → win-unpacked\resources\ocr-models
          foreach ($m in @('det.onnx', 'rec.onnx', 'cls.onnx', 'keys.txt')) {
            $p = Join-Path $unpacked "resources\ocr-models\$m"
            if (-not (Test-Path $p)) { throw "OCR 模型未随包：$m" }
          }
          Write-Host ($(Get-ChildItem (Join-Path $unpacked "resources\ocr-models") | Measure-Object -Property Length -Sum).Sum / 1MB)

          # 剥完只剩 win32/x64：其它平台目录残留 = afterPack 没生效，包会白胖 ~85MB
          $ortBin = Join-Path $unpacked "resources\app.asar.unpacked\node_modules\onnxruntime-node\bin\napi-v6"
          $dirs = Get-ChildItem $ortBin -Directory | ForEach-Object { $_.Name }
          Write-Host "ORT platform dirs: $($dirs -join ', ')"
          if ($dirs -contains 'linux' -or $dirs -contains 'darwin') { throw "ORT 未剥离异平台目录：$($dirs -join ', ')" }
          $sub = Get-ChildItem (Join-Path $ortBin "win32") -Directory | ForEach-Object { $_.Name }
          if (($sub | Where-Object { $_ -ne 'x64' }).Count -gt 0) { throw "ORT 未剥离异架构目录：$($sub -join ', ')" }

          # rg：平台段 extraResources 的 filter 是 win32-${arch}/**，缺了不报错
          if (-not (Test-Path (Join-Path $unpacked "resources\bin\win32-x64\rg.exe"))) { throw "内置 rg 未随包（搜索会静默降级成 grep 兜底）" }

      - name: Report artifact
        shell: pwsh
        run: Get-ChildItem dist\*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: PulseMind-win-x64-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
