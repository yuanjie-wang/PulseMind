# Windows/x64 unpacked 打包（2026-11-24 裁定：交付 = PulseMind-<ver>-win-x64.zip，
# 不再产 portable 单文件 exe；与 linux 侧「只留免 root tarball」同一刀）。
#
# 目标：产出可解压即跑的整棵 win-unpacked（build.win.target = ["dir"]），并让它
# **装机即能启动**。2026-10-14 的 0.4.2 win portable 曾「装完就崩 Cannot find
# module 'archiver-utils'」——那是 two packing bugs（平台段 files 全否定触发
# `**/*` 全捕获 + Go 依赖树静默丢包），已在 package.json 与 afterPack 门禁里修掉；
# 本 workflow 因此**不重做那层检查**，而是把「跑完 electron-builder 不等于产物
# 能用」这件事换成几条显式断言（见 Package 之后的步骤）。
#
# 为什么不在 mac 上交叉打：win 目标的 exe 元数据改写（图标/版本资源）走 rcedit，
# 非 Windows 宿主需要 wine（本仓开发机实测没有 wine）。GitHub 的 windows runner
# 免掉这层。
#
# 与 build-linux.yml 的三处刻意差异：
#   · **不设 npm_config_build_from_source**：那条旗是为 glibc 天花板钉的，
#     Windows 不存在这个问题。better-sqlite3 的 win32-x64 prebuild 与 Electron
#     33 的 ABI 对得上，让 prebuild-install 直接取，省掉 MSVC 编译时间。
#     万一 prebuild 缺席，node-gyp 会回落编译，windows-latest 自带 VS Build Tools。
#   · **不设 PLAYWRIGHT_HOST_PLATFORM_OVERRIDE**：Linux 那边是因为 runner 发行
#     版被 Playwright 从支持矩阵里摘了才 override；Windows 是原生支持的一格。
#   · 架构只出 x64：win.extraResources 的 filter 是 `win32-${arch}/**`，而
#     resources/bin 只有 win32-x64（arm64 缺 rg 会静默降级成 grep 兜底）。
#
# 原生模块的 ABI 由 `npm ci` 的 postinstall 保证：scripts 里有
# `postinstall: electron-builder install-app-deps`，它按 devDependencies 的
# electron 版本重建 —— 所以 build 配置里的 npmRebuild:false 不影响这里。

name: Build Windows unpacked

on:
  workflow_dispatch:
    inputs:
      # 手动触发时把产物传进哪个 Release（如 v0.5.0）。留空则只上传 artifact。
      release-tag:
        description: '上传产物到该 Release（如 v0.5.0，留空则不上传）'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  # write：要把产物上传到 Release（gh release upload）。
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unpacked:
    name: win/x64 unpacked
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      # 对齐 build-linux.yml 的 node 20（两者产出同一个版本的 asar 形态）。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-win-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      # node_modules 必须来自干净安装：afterPack 的 verify-packed-node-modules
      # 门禁要求纯安装树（AGENTS.md「打包两刀」），不要在 CI 里缓存它。
      # postinstall 会跑 electron-builder install-app-deps，原生模块在这一步
      # 就按 Electron 33 的 ABI 重建成 win32-x64。
      - name: Install dependencies
        run: npm ci

      - name: Assert native modules target Electron+win32
        shell: pwsh
        run: |
          $node_exe = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (-not (Test-Path $node_exe)) { throw "better-sqlite3 二进制缺失 —— postinstall 的重建没跑成" }
          # 头部 MZ 即 Windows PE；ELF/Mach-O 说明装进了一个别的平台的产物
          $magic = [System.IO.File]::ReadAllBytes((Resolve-Path $node_exe))[0..1]
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "better_sqlite3.node 不是 PE 格式（magic=$($magic -join ','))" }
          Get-Item $node_exe | Select-Object Length, FullName | Format-List
          $sharp = Get-ChildItem "node_modules\@img" -Directory | Where-Object { $_.Name -like '*win32*' }
          if (-not $sharp) { throw "sharp 的 win32 变体没装上（@img 下只有 $((Get-ChildItem node_modules\@img -Directory).Name -join ', ')）—— 图片链路会在运行期崩" }
          $sharp | ForEach-Object { Write-Host "sharp variant: $($_.Name)" }
          $wasm = "node_modules\onnxruntime-web\dist\ort-wasm-simd-threaded.wasm"
          if (-not (Test-Path $wasm)) { throw "onnxruntime-web 的 wasm 引擎缺失 —— OCR 不可用" }
          Get-Item $wasm | Select-Object Length | Format-List
          if (Test-Path "node_modules\onnxruntime-node") { throw "onnxruntime-node 仍在依赖树 —— 它会带入 DirectML.dll，Win10 1809 上 OCR 必崩（1114）" }

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      # PLAN-voice-input M3：引擎随包。win 包零后处理（process.dlopen 的
      # LOAD_WITH_ALTERED_SEARCH_PATH 解析同目录 dll），脚本只产 sha manifest。
      - name: Prepare bundled ASR engine
        run: node scripts/prepare-asr-engine.js

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的契约是「永不非零退出」（缺了只 warn，让没有
      # Chromium 的开发机也能打包），代价是任何取浏览器失败都会静默变成
      # 「一个没有内置浏览器的包」。CI 里没有这个让步的必要。
      # ensure-chromium 会把 chrome-win64 归一化成 chrome-win（名字对齐
      # ManagedBackend 的期待），所以断言的是归一化后的目录。
      - name: Verify bundled Chromium landed
        shell: pwsh
        run: |
          $chrome = "resources\chromium\chrome-win\chrome.exe"
          if (-not (Test-Path $chrome)) {
            Write-Host "::error::$chrome missing — ensure-chromium never fails, so this step is the only browser-less-package gate"
            if (Test-Path resources\chromium) { Get-ChildItem resources\chromium -Recurse -Depth 2 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName } }
            exit 1
          }
          Get-Item $chrome | Select-Object Length | Format-List

      # 只出 win-unpacked（dir 目标）：交付 zip 的唯一来源。portable / nsis 两个
      # 安装器形态在 2026-11-24 退役（与 linux 侧的 deb 同刀）。
      - name: Package unpacked app
        run: npx electron-builder --win dir --x64 --publish never

      # 一档+二档瘦身（2026-11-24，afterPack 的 prune-packaged-assets）：语言资源
      # 只留 en/zh 族、Windows 桌面集成件删净，实测一次裁掉 100.2MB。afterPack 抛
      # 异常会让构建红，但「这一刀根本没接上」的表现是**静默零收益**——这条
      # dry-run 自检（还该删的项必须为零 + en/zh 仍在）是它真跑过的唯一证据。
      - name: Verify pruned locales and desktop extras
        run: node scripts/prune-packaged-assets.js --verify --app-out dist/win-unpacked --platform win32

      # 裁完的浏览器还能不能起来：拿**包内** chrome.exe 真跑一次 headless
      # （setContent + evaluate + screenshot）。二档删的都是启动路径外的文件，但
      # 删错一个（chrome_elf.dll / D3DCompiler_47.dll / locales 删空）只有真启动
      # 能抓到——2026-11-09 OCR 的教训是「冒烟自配一套逻辑 = 门禁绿、装机崩」，
      # 所以这里走产品同一条路：playwright-core 的 chromium.launch({executablePath})。
      - name: Smoke packed Chromium launch
        run: node scripts/smoke-packed-chromium.js --app-out dist/win-unpacked --platform win32

      # afterPack 删掉了执行提供器库（CUDA/TensorRT/shared）与异平台二进制。
      # 文件存在 ≠ 能加载：这里拿打包后的 onnxruntime 真建 det/rec/cls 三个会话。
      - name: Smoke packed OCR runtime
        run: node scripts/smoke-packed-ocr.js --app-out dist/win-unpacked --platform win32 --arch x64

      # PLAN-voice-input M3：包内引擎真加载（M0 门 2 的 CI 前哨——真 1809 实机
      # 验证仍要人工跑一次，见 PLAN §4）。模型缓存段沿用 mac 的 key。
      - name: Cache ASR model for smoke
        id: asr-model
        uses: actions/cache@v4
        with:
          path: ~/asr-model-smoke
          key: asr-sensevoice-2024-07-17
      - name: Fetch ASR model for smoke
        if: steps.asr-model.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force ~/asr-model-smoke | Out-Null
          Invoke-WebRequest -Uri 'https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx' -OutFile ~/asr-model-smoke/model.int8.onnx
          Invoke-WebRequest -Uri 'https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt' -OutFile ~/asr-model-smoke/tokens.txt
      - name: Smoke packed ASR runtime
        shell: pwsh
        run: |
          $modelArgs = @()
          if (Test-Path "$HOME/asr-model-smoke/model.int8.onnx") { $modelArgs = @('--model-dir', "$HOME/asr-model-smoke") }
          node scripts/smoke-packed-asr.js --app-out dist/win-unpacked --platform win32 --arch x64 @modelArgs

      # 体积取证：afterPack 报的 freed 数字是「删掉的字节」，与最终交付 zip 的体积
      # 不是一回事（压缩率、对齐、unpacked 之外的文件都会拉偏）。这里只报告**树本身**
      # ——交付 zip 的体积与 sha256 在 Package unpacked zip 一步量。
      # 只产出日志 + 几 KB CSV，不传大文件：948MB 的树在这条网络上已两次超时。
      # 故意排在 Assert 之前——断言会 throw，而清单在失败时才有诊断价值。
      - name: Report unpacked tree
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist\win-unpacked").Path
          function MB($b) { if ($null -eq $b) { 0 } else { [math]::Round($b / 1MB, 1) } }

          $all = Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue
          $total = ($all | Measure-Object -Property Length -Sum).Sum
          Write-Host ("=== win-unpacked total: {0:N1} MB / {1} files ===" -f (MB $total), $all.Count)

          function Show-Tree([string]$path, [string]$label) {
            Write-Host ""
            Write-Host "=== $label ==="
            Get-ChildItem $path -ErrorAction SilentlyContinue | ForEach-Object {
              $b = if ($_.PSIsContainer) {
                (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue |
                  Measure-Object -Property Length -Sum).Sum
              } else { $_.Length }
              [PSCustomObject]@{ Item = $_.Name; MB = (MB $b) }
            } | Sort-Object MB -Descending | Format-Table -AutoSize | Out-String | Write-Host
          }

          Show-Tree $root "top level"
          Show-Tree (Join-Path $root "resources") "resources"

          # ORT 递归清单：这是 187.3MB 悬案的核心，剥完到底还剩什么、各多大
          $ort = Join-Path $root "resources\ort-web"
          $ortFiles = @()
          $ortBytes = 0
          if (Test-Path $ort) {
            $ortFiles = Get-ChildItem $ort -Recurse -File
            $ortBytes = ($ortFiles | Measure-Object -Property Length -Sum).Sum
            Write-Host ""
            Write-Host ("=== onnxruntime-node: {0:N1} MB / {1} files ===" -f (MB $ortBytes), $ortFiles.Count)
            $ortFiles | Sort-Object Length -Descending |
              Select-Object @{n='MB';e={ MB $_.Length }},
                            @{n='Rel';e={ $_.FullName.Substring($ort.Length + 1) }} |
              Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host ""
            Write-Host "WARNING: onnxruntime-node 未 unpack"
          }

          $csv = "dist\win-unpacked-manifest.csv"
          $all | Select-Object @{n='Bytes';e={$_.Length}},
                                @{n='Rel';e={$_.FullName.Substring($root.Length + 1)}} |
            Sort-Object Bytes -Descending | Export-Csv -NoTypeInformation -Encoding utf8 $csv
          Write-Host ("manifest -> {0} ({1:N0} bytes)" -f $csv, (Get-Item $csv).Length)

          $exe = Join-Path $root "PulseMind.exe"
          if (-not (Test-Path $exe)) { throw "win-unpacked 顶层缺少 PulseMind.exe" }
          if ($env:GITHUB_STEP_SUMMARY) {
            $rows = @(
              "### win-unpacked 体积清单",
              "",
              "| 项 | 大小 |",
              "|---|---|",
              ("| win-unpacked 总计 | **{0:N1} MB** / {1} files |" -f (MB $total), $all.Count),
              ("| onnxruntime-node | **{0:N1} MB** / {1} files |" -f (MB $ortBytes), $ortFiles.Count),
              ("| PulseMind.exe | **{0:N1} MB** |" -f (MB (Get-Item $exe).Length))
            )
            $rows | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # 「electron-builder 退出码 0」不等于「产物能用」——0.4.2 那次就是这么发出去的。
      # 三条断言对应三个曾经/可能真出事的点：依赖树完整性（afterPack 门禁已跑，
      # 这里复核 win-unpacked 真的产出了）、OCR 模型随包（extraResources 的模型是
      # 全局段，不依赖平台 filter，但值得钉住）、ORT 呈 ort-web 形态（纯 WASM，
      # onnxruntime-node 应已不在包内）。
      - name: Assert packaged tree is usable
        shell: pwsh
        run: |
          $unpacked = "dist\win-unpacked"
          if (-not (Test-Path $unpacked)) { throw "dist\win-unpacked 不存在" }
          $asar = Join-Path $unpacked "resources\app.asar"
          if (-not (Test-Path $asar)) { throw "app.asar 缺失" }
          Write-Host ("app.asar: {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

          # OCR 模型走全局 extraResources → win-unpacked\resources\ocr-models
          foreach ($m in @('det.onnx', 'rec.onnx', 'cls.onnx', 'keys.txt')) {
            $p = Join-Path $unpacked "resources\ocr-models\$m"
            if (-not (Test-Path $p)) { throw "OCR 模型未随包：$m" }
          }
          Write-Host ($(Get-ChildItem (Join-Path $unpacked "resources\ocr-models") | Measure-Object -Property Length -Sum).Sum / 1MB)

          # 依赖已从 onnxruntime-node（原生、静态带 DirectML）换成 onnxruntime-web
          # （纯 WASM）。所以「包内有 onnxruntime-node」才是错，「ort-web 三件套随包」
          # 才是对 —— 下面这两条合起来钉住这次切换，别再退回旧守卫。
          $legacyOrt = Join-Path $unpacked "resources\app.asar.unpacked\node_modules\onnxruntime-node"
          if (Test-Path $legacyOrt) { throw "onnxruntime-node 仍在包内 —— 依赖切换未完成（白胖 ~59MB + DirectML 崩点）：$legacyOrt" }
          $ortWeb = Join-Path $unpacked "resources\ort-web"
          foreach ($f in @('ort.node.min.js', 'ort-wasm-simd-threaded.mjs', 'ort-wasm-simd-threaded.wasm')) {
            if (-not (Test-Path (Join-Path $ortWeb $f))) { throw "ort-web 运行时未随包：$f" }
          }
          Write-Host "ORT: ort-web 三件套齐全，onnxruntime-node 已不在包内（符合预期）"

          # rg：平台段 extraResources 的 filter 是 win32-${arch}/**，缺了不报错
          if (-not (Test-Path (Join-Path $unpacked "resources\bin\win32-x64\rg.exe"))) { throw "内置 rg 未随包（搜索会静默降级成 grep 兜底）" }

      # 交付形态（2026-11-24 裁定，user「windows要unpacked，不要portable」）：整棵
      # 树改名成带版本号的顶层文件夹再压 zip——解压得到一个目录、里面直接是
      # PulseMind.exe，不会把上千个文件撒进「下载」。Move-Item 是同卷改名（瞬时，
      # 不产生第二份 948MB），与 linux 侧 staging 的 cp -a 等价。
      # 必须显式压 zip 再上传：upload-artifact 直接传目录时它自己打的那个 zip 在
      # `gh run download` 会被就地解开，拿不到原始压缩包。用 7z 而非 Compress-Archive
      # ——后者对 948MB / 千余文件整棵读进内存，runner 上容易 OOM 或超时。
      # Push-Location 进 dist 再 7z：存档内的路径就是 `PulseMind-<ver>-win-x64/…`，
      # 不带 `dist/` 前缀（此前 `7z … dist\win-unpacked` 会把 dist 也存进去）。
      - name: Package unpacked zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "PulseMind-$version-win-x64"
          $stage = "dist\$name"
          $zip = "dist\$name.zip"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip }
          Move-Item dist\win-unpacked $stage
          if (-not (Test-Path (Join-Path $stage "PulseMind.exe"))) {
            Get-ChildItem $stage | Select-Object Name | Format-Table | Out-String | Write-Host
            throw "顶层缺少 PulseMind.exe —— 解压即跑的形态被破坏了"
          }
          Push-Location dist
          try {
            7z a -tzip -mx=5 "$name.zip" $name | Select-Object -Last 6
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($code -ne 0) { throw "7z 打包失败 (exit $code)" }
          $f = Get-Item $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host ("{0}.zip = {1:N1} MB / {2:N0} bytes" -f $name, ($f.Length / 1MB), $f.Length)
          Write-Host ("sha256: {0}" -f $sha)
          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              "### $name.zip",
              "",
              "| 项 | 值 |",
              "|---|---|",
              ("| 大小 | **{0:N1} MB** |" -f ($f.Length / 1MB)),
              ("| 字节 | {0:N0} |" -f $f.Length),
              ("| sha256 | ``$sha`` |")
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Report artifact
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table
          Get-ChildItem dist\*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name }

      - name: Upload unpacked zip
        uses: actions/upload-artifact@v4
        with:
          # 固定名（不拼 github.ref_name：分支名里的 `/` 会让 upload 红）。
          name: PulseMind-win-x64-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # 把产物挂进 GitHub Release。artifact 只保 14 天，Release 是永久的；且构建机
      # 在 GitHub 内网，上传比「本地下载再上传」快几个数量级（本地实测 42KB/s）。
      # 触发：push v* tag，或手动触发时填了 release-tag。Release 不存在则顺手建。
      # shell: bash —— windows runner 默认 pwsh，而 pwsh 不会展开 dist/*.zip 的 glob，
      # gh 会收到字面量路径报错。Git Bash 随 runner 自带。
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "PulseMind ${TAG#v}" --notes "PulseMind ${TAG#v}"
          gh release upload "$TAG" dist/*.zip --repo "$REPO" --clobber
          echo "release assets: $(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join(", ")')"
