name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fastest signal first: style/type errors before the slow suite.
      - name: Lint (zero errors; warnings are the documented any/deps tiers)
        run: npm run lint

      # -b, not --noEmit: the root tsconfig is solution-style (files: [] +
      # references) and tsc --noEmit does not enter references — it checked
      # ZERO files and exited 0 (measured), so the gate was always green.
      # -b typechecks all three projects (node/web/extension) and caches
      # incrementally in .tsbuildinfo.
      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test
