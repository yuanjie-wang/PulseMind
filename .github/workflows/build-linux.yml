# Linux/x64 .deb 打包（目标机：UOS 20 / Debian 10，glibc 2.28）。
#
# 为什么整个 job 跑在 buildpack-deps:buster 容器里，而不是裸 ubuntu-22.04 runner：
# better-sqlite3 是 Electron ABI 的原生模块，打包时 `npm ci` 的 postinstall
# （electron-builder install-app-deps → @electron/rebuild → node-gyp）会用
# **构建机**的 glibc 头文件现场编译 —— 装到 UOS 20（glibc 2.28）上要能启动，
# 编译基线就得 ≤ 2.28。这一档是实测钉出来的：
#   · ubuntu runner（glibc 2.35+）→ .node 引用 GLIBC_2.34，启动即 undefined symbol
#   · bullseye（glibc 2.31）→ 实测编出 better_sqlite3.node 要求 GLIBC_2.29，
#     门禁红了（2026-11-05 第二次 CI）
#   · buster（glibc 2.28）→ 与目标机严格同基线，编译期符号版本不可能超出
# 打包完 scripts/check-linux-glibc.js 会把每个 .node 的符号需求重量一遍，
# 超过 2.28 直接红。
#
# node 官方镜像没有 buster 变体（20 系列从 nodejs/docker-node#1885 起就没出过），
# 所以基座用 buildpack-deps:buster（自带 python3/make/g++/git/curl 全套工具链），
# node 本体从 nodejs.org 装官方二进制 —— node ≥18 的官方 Linux 构建目标就是
# glibc 2.28（RHEL 8 基线），本体不吃亏。两个 EOL 发行版的老坑照旧：
# **不要在这个容器里跑 apt-get install**（bullseye 那次是 404，buster 的源已整体
# 搬去 archive.debian.org，一样不可信），一切依赖镜像自带。
#
# python 版本：重编链是 @electron/rebuild 4.0.4 硬性携带 node-gyp ^12（12.3.0）。
# buster 自带的 python 3.7 过得了 find-python.js 的运行时门（`>=3.6.0`，v12.3.0
# 第 46 行），但 gyp 的代码用了 Python 3.8 的 walrus 语法（`gyp/__init__.py:212`
# 的 `if flags := ...`），import 即 SyntaxError —— 所以容器里另装 python 3.12
# （python-build-standalone 独立构建，实测产物符号下限 GLIBC_2.17，buster 吃得下；
# 哪天它抬高基线，这步会以「python --version 失败」或 gyp 深处的错明确红出来）。
#
# 两条缓存都是必需的，且都不是省事：
#   · resources/chromium 是 gitignore 的，构建时由 ensure-chromium.js 从
#     Playwright 缓存拷进来；它**刻意永不失败**（缺了只 warn），所以 CI 里不装
#     就等于发一个没有内置 Chromium、浏览器工具静默回落系统 Chrome 的包。
#   · node_modules 必须来自干净 npm ci：afterPack 的 verify-packed-node-modules
#     门禁要求纯安装树（见 AGENTS.md「打包两刀」），不要在 CI 里缓存它。
#
# 架构：只有 x64。arm64/loongarch 要另立 job + 先补 resources/bin/linux-arm64/rg
# （现在 filter `linux-${arch}/**` 匹配空不报错，搜索会静默降级成 grep 兜底），
# 且 GH 的 arm64 runner 只在 ubuntu-24.04-arm 上（公开仓免费）。

name: Build Linux deb

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: linux/x64 deb
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: buildpack-deps:buster
    env:
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Playwright 1.63 的 registry 里 debian11-* 是 void 0（这个发行版被从支持
      # 矩阵里摘了），于是 `playwright-core install chromium` 报
      # "ERROR: Playwright does not support chromium on debian11-x64"。
      # 但 debian12/debian13 与 ubuntu22.04/24.04 那几格指向的是**同一个**
      # `linux64/chrome-linux64.zip` —— 这个 override 只绕开一张支持性表格，不会
      # 换来一个「别的二进制」。必须作用到 `npm run build`：ensure-chromium.js 用
      # executablePath() 走同一张表解析缓存路径，只在 install 步骤设它，build 那
      # 一步就会静默拷不到东西（而 ensure-chromium 永不非零退出）。
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'debian12-x64'
      # 容器只负责打包，从不启动浏览器 —— Chromium 的运行时依赖要在目标机（UOS）
      # 上满足。不跳过这层，Playwright 会拿 debian12 的依赖清单校验 buster 容器
      # （缺 libgbm/libasound 等一串），而补库的唯一工具 install-deps 走 apt，
      # 已因发行版 EOL 不可用（见下面的工具链步骤）。
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: '1'

    steps:
      # node 官方镜像没有 buster 变体，node 本体从 nodejs.org 装官方二进制。
      # 版本钉 v20.19.6 与开发机同款；node ≥18 的官方 Linux 构建目标就是 glibc
      # 2.28（RHEL 8 基线），本体不在 buster 上吃亏。装到 /usr/local 后
      # checkout@v4（需要容器里有 node20）才有得用 —— 所以这一步必须在 checkout 前。
      - name: Install Node 20
        run: |
          curl -fsSL https://nodejs.org/dist/v20.19.6/node-v20.19.6-linux-x64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local
          node -v
          npm -v

      # 不跑 apt（2026-11-04 首次 CI 实测教训）：bullseye 已 EOL，`apt-get install
      # ca-certificates` 会顺带升级到一个 Debian 已从 deb.debian.org 摘掉的路径
      # （Debian-security 的 ca-certificates_*~deb11u1 404），job 在 checkout 之前
      # 就红。buster 更甚：源已整体搬去 archive.debian.org。工具链全部吃镜像自带
      # （buildpack-deps 基座），这里只做存在性断言：上游镜像哪天真的瘦身，会在这里
      # 明确报错，而不是在 node-gyp 深处抛一堆看不懂的东西。
      - name: Verify build toolchain
        run: |
          for tool in python3 make g++ git curl tar xz; do
            command -v "$tool" > /dev/null || { echo "missing build tool: $tool"; exit 1; }
          done
          python3 --version
          g++ --version | head -1

      # gyp（node-gyp 12 的构建脚本引擎）用了 Python 3.8 的 walrus 语法，系统自带
      # 的 3.7 import 即 SyntaxError（find-python 的 ≥3.6 门挡不住语法）。装
      # python-build-standalone 的独立构建并放进 PATH —— node-gyp 按 PATH 挑
      # python3，装在 npm ci 之前才来得及被重编链用上。
      - name: Install Python 3.12
        run: |
          mkdir -p /opt/python
          curl -fsSL 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.12.16%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz' \
            | tar -xz -C /opt/python --strip-components=1
          /opt/python/bin/python3 --version
          echo '/opt/python/bin' >> "$GITHUB_PATH"
          python3 --version

      - uses: actions/checkout@v4

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: /root/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/electron
            /root/.cache/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          node -v
          npm -v
          npm ci

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的设计契约是「永不非零退出」（缺了只 warn，让没有
      # Chromium 的开发机也能打包），代价是**任何**取浏览器失败都会静默变成
      # 「一个没有内置浏览器的包」。CI 里没有这个让步的必要：资源没落下就是红。
      - name: Verify bundled Chromium landed
        run: |
          chrome=resources/chromium/chrome-linux/chrome
          if [ ! -x "$chrome" ]; then
            echo "::error::$chrome missing — ensure-chromium never fails, so this step is the only browser-less-package gate"
            find resources/chromium -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          du -sh resources/chromium
          file "$chrome"

      - name: Package deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Check glibc ceiling of shipped native modules
        run: node scripts/check-linux-glibc.js dist/linux-unpacked --ceiling=2.28

      # 只报告、不判红：这个二进制由 Google 的 Chrome for Testing 构建，glibc 下限
      # 我们改不了（既不能重编，也没有更老的 Linux 版本可换）。而它决定「浏览器工具
      # 在 UOS 20 上到底能不能启动」，所以这个数字值得每次打印出来，而不是等到目标机
      # 上 undefined symbol 才被发现。
      - name: Report bundled Chromium glibc floor (informational)
        run: |
          node -e '
            const fs = require("node:fs")
            const { scan, formatVersion } = require("./scripts/check-linux-glibc.js")
            const file = "resources/chromium/chrome-linux/chrome"
            const row = scan([file])[0]
            const shown = row.max ? formatVersion(row.max) : "static (no glibc refs)"
            console.log(`bundled Chromium requires up to GLIBC_${shown} (UOS 20 = 2.28)`)
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `### bundled Chromium glibc floor\n\n\`${file}\` → max GLIBC **${shown}**（目标机 UOS 20 = 2.28）\n`,
              )
            }
          '

      - name: Report artifact
        run: ls -lh dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: pulsemind-deb-${{ github.ref_name }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
