# Linux/x64 .deb 打包（目标机：UOS 20 / Debian 10，glibc 2.28）。
#
# better-sqlite3 是 Electron ABI 的原生模块，打进包里的 better_sqlite3.node 必须
# 在 UOS 20（glibc 2.28）上能加载。这一层是四轮 CI 实测钉出来的（2026-11-04/05）：
#   · ubuntu runner（glibc 2.35+）→ .node 引用 GLIBC_2.34，启动即 undefined symbol
#     且构建期毫无提示
#   · bullseye 容器直接编 → 官方 electron-v130 prebuild（WiseLibs 发在新 glibc 上，
#     要求 GLIBC_2.29）被 @electron/rebuild 静默装进去 —— 它的 prebuild 路径**不做
#     加载校验**，编译机 glibc 根本没机会决定产物
#   · buster 容器（glibc 2.28 与目标机同基线）→ prebuild 在 2.28 上加载失败回落
#     编译，但 buster 的 g++ 8.3 认不得 better-sqlite3 12.9 要求的 -std=c++20
#   · 最终形态：bullseye 容器 + **zig 当编译器**（自带 clang，C++20 没问题），
#     -target x86_64-linux-gnu.2.28 把符号下限精确钉在 2.28；libc++ 静态链接，
#     连 UOS 的 libstdc++ 版本兼容都不用操心
# 所以容器回到 node:20-bullseye（python 3.9 过得了 gyp 的 3.8 语法门；官方镜像
# 没有 buster 变体，而 buster 又养不起 g++ 20/clang），编译完全交给 zig。
# 打包完 scripts/check-linux-glibc.js 把每个 .node 的符号需求重量一遍，
# 超过 2.28 直接红 —— 上游 Electron 33.4.11 linux-x64 本体实测只要 GLIBC_2.25。
#
# **不要在这个容器里跑 apt-get install**（2026-11-04 首次 CI 实测：bullseye 已
# EOL，`apt-get install ca-certificates` 会顺带升级到一个 Debian 已从
# deb.debian.org 摘掉的路径，404，job 在 checkout 之前就红）。工具链（python3/
# make/g++/git/curl）全吃镜像自带，唯一例外是 zig（见步骤注释）。
#
# 两条缓存都是必需的，且都不是省事：
#   · resources/chromium 是 gitignore 的，构建时由 ensure-chromium.js 从
#     Playwright 缓存拷进来；它**刻意永不失败**（缺了只 warn），所以 CI 里不装
#     就等于发一个没有内置 Chromium、浏览器工具静默回落系统 Chrome 的包。
#   · node_modules 必须来自干净 npm ci：afterPack 的 verify-packed-node-modules
#     门禁要求纯安装树（见 AGENTS.md「打包两刀」），不要在 CI 里缓存它。
#
# 架构：只有 x64。arm64/loongarch 要另立 job + 先补 resources/bin/linux-arm64/rg
# （现在 filter `linux-${arch}/**` 匹配空不报错，搜索会静默降级成 grep 兜底），
# 且 GH 的 arm64 runner 只在 ubuntu-24.04-arm 上（公开仓免费）。
#
# 交付两种落地方式，同一份 linux-unpacked、同一套门禁（2026-11-10，UOS 实测普通
# 用户没有 root，`dpkg -i` 直接不可用）：
#   · .deb —— 给有 root（或能 sudo）的机器；
#   · PulseMind-<ver>-linux-x64.tar.gz —— 免安装包：PulseMind/ + install.sh +
#     icon.png，解压后跑 install.sh，应用与桌面入口全落在当前用户家目录
#     （~/Applications/PulseMind、~/.local/share/{applications,icons}），
#     不调 sudo、不碰系统目录。打包后在同一 job 里用临时 HOME 真跑一遍装/卸。

name: Build Linux packages

on:
  workflow_dispatch:
    inputs:
      # 手动触发时把产物传进哪个 Release（如 v0.5.0）。留空则只上传 artifact。
      release-tag:
        description: '上传产物到该 Release（如 v0.5.0，留空则不上传）'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  # write：要把产物上传到 Release（gh release upload）。
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: linux/x64 deb
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: node:20-bullseye
    env:
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 原生模块的编译器 = zig（经包装脚本）。容器的 g++ 8.3 认不得 better-sqlite3
      # 12.9 的 -std=c++20，而容器 glibc 2.31 编出来的符号又超 2.28 —— zig 的 clang
      # 两个都解决：C++20 没问题，-target 的 glibc 后缀把符号下限精确钉在
      # 2.28（libc++ 还静态链接进 .node，不新增运行时依赖）。gyp 的 make 生成器
      # 从环境读 CC/CXX（gyp/generator/make.py 的 GetEnvironFallback），node-gyp
      # 与 @electron/rebuild 的编译因此都走这里。包装脚本滤掉 -Wl,--exclude-libs
      # （zig 至今不支持，见 scripts/zig-cc-wrapper.sh 头注）。
      CC: /opt/zig/bin/zig-cc cc -target x86_64-linux-gnu.2.28
      CXX: /opt/zig/bin/zig-cc c++ -target x86_64-linux-gnu.2.28
      # 官方 prebuild 是在新 glibc 上构建的（node-v115 与 electron-v130 的
      # linux-x64 prebuild 都要求 GLIBC_2.29），prebuild-install 的 electron
      # 路径不做加载校验、node 路径在 2.28 上加载失败才回落 —— 无论哪种，都能
      # 绕过编译侧修复或直接装进旧 glibc 都载不动的二进制。这面旗让
      # prebuild-install 在**下载之前**就退出（bin.js 的 buildFromSource 短路，
      # 两条调用路径都读它），所有原生模块一律现编译。
      npm_config_build_from_source: 'true'
      # Playwright 1.63 的 registry 里 debian11-* 是 void 0（这个发行版被从支持
      # 矩阵里摘了），于是 `playwright-core install chromium` 报
      # "ERROR: Playwright does not support chromium on debian11-x64"。
      # 但 debian12/debian13 与 ubuntu22.04/24.04 那几格指向的是**同一个**
      # `linux64/chrome-linux64.zip` —— 这个 override 只绕开一张支持性表格，不会
      # 换来一个「别的二进制」。必须作用到 `npm run build`：ensure-chromium.js 用
      # executablePath() 走同一张表解析缓存路径，只在 install 步骤设它，build 那
      # 一步就会静默拷不到东西（而 ensure-chromium 永不非零退出）。
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'debian12-x64'
      # 容器只负责打包，从不启动浏览器 —— Chromium 的运行时依赖要在目标机（UOS）
      # 上满足。不跳过这层，Playwright 会拿 debian12 的依赖清单校验容器（缺
      # libgbm/libasound 等一串），而补库的唯一工具 install-deps 走 apt，已因
      # bullseye EOL 不可用（见下面的工具链步骤）。
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: '1'

    steps:
      # 不跑 apt（2026-11-04 首次 CI 实测教训）：python3/make/g++/git/ca-certificates
      # 镜像里全都有，而 bullseye 已 EOL —— `apt-get install ca-certificates` 会
      # 顺带升级到一个 Debian 已从 deb.debian.org 摘掉的路径（Debian-security 的
      # ca-certificates_*~deb11u1 404），job 在 checkout 之前就红。
      # 这里只做存在性断言：上游镜像哪天真的瘦身，会在这里明确报错，而不是在
      # node-gyp 深处抛一堆看不懂的东西。
      - name: Verify build toolchain
        run: |
          node -v
          npm -v
          for tool in python3 make git curl tar xz; do
            command -v "$tool" > /dev/null || { echo "missing build tool: $tool"; exit 1; }
          done
          python3 --version

      - uses: actions/checkout@v4

      # 唯一镜像外来的工具。钉 0.13.0（自带 clang 17，C++20 够用；这个版本
      # ziglang.org 的包名还是 arch-last 形态）。包装脚本从仓库装（scripts/
      # zig-cc-wrapper.sh，滤 -Wl,--exclude-libs），所以这一步必须在 checkout 之后。
      - name: Install zig (compiler for native modules)
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ -C /opt
          mv /opt/zig-linux-x86_64-0.13.0 /opt/zig
          # 0.13.0 的包布局没有 bin/ 子目录（zig 本体就在包根），-D 让 install
          # 顺手建出 /opt/zig/bin
          install -D -m 755 scripts/zig-cc-wrapper.sh /opt/zig/bin/zig-cc
          echo '/opt/zig/bin' >> "$GITHUB_PATH"
          # GITHUB_PATH 只对后续步骤生效，本步骤里用全路径自证
          ZIG_BIN=/opt/zig/zig /opt/zig/bin/zig-cc version

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: /root/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/electron
            /root/.cache/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          node -v
          npm -v
          npm ci

      # 与 mac/windows 的「Assert native modules target …」同层，只覆盖 OCR 这一条：
      # 这一层必须查依赖树、不能只查包内。onnxruntime-web 在 devDependencies，
      # 若 onnxruntime-node 哪天也落回 devDependencies，它根本不会进 asar.unpacked，
      # 只查打包产物是查不出来的。
      - name: Assert ORT deps are WASM-only
        run: |
          wasm=node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
          if [ ! -f "$wasm" ]; then
            echo "::error::onnxruntime-web 的 wasm 引擎缺失 —— OCR 不可用"
            exit 1
          fi

          if [ -d node_modules/onnxruntime-node ]; then
            echo "::error::onnxruntime-node 仍在依赖树 —— 依赖已换成 onnxruntime-web，它只会白胖并带入原生 EP"
            exit 1
          fi

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的设计契约是「永不非零退出」（缺了只 warn，让没有
      # Chromium 的开发机也能打包），代价是**任何**取浏览器失败都会静默变成
      # 「一个没有内置浏览器的包」。CI 里没有这个让步的必要：资源没落下就是红。
      - name: Verify bundled Chromium landed
        run: |
          chrome=resources/chromium/chrome-linux/chrome
          if [ ! -x "$chrome" ]; then
            echo "::error::$chrome missing — ensure-chromium never fails, so this step is the only browser-less-package gate"
            find resources/chromium -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          du -sh resources/chromium
          file "$chrome"

      - name: Package deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Check glibc ceiling of shipped native modules
        run: node scripts/check-linux-glibc.js dist/linux-unpacked --ceiling=2.28

      # afterPack 删掉了 352MB 的执行提供器库（CUDA/TensorRT/shared）与异平台二进制。
      # 退出码 0 只说明打包完成，不说明裁完的二进制还能加载 —— 这里用**打包产物**
      # 的 onnxruntime 真建三个会话，缺库会当场 failed to load。
      - name: Smoke packed OCR runtime
        run: node scripts/smoke-packed-ocr.js --app-out dist/linux-unpacked --platform linux --arch x64

      # Windows 侧有个悬案：afterPack 报 freed 187.3MB，portable exe 却几乎没变。
      # 这里输出同样的清单当对照组——deb 已知从 370M 降到 256M，若 linux-unpacked
      # 也同步缩了 443.7MB，就说明「删了不缩」是 Windows/portable 独有。
      - name: Report unpacked tree
        run: |
          echo "=== linux-unpacked total ==="
          du -sh dist/linux-unpacked
          echo ""
          echo "=== top level ==="
          du -sh dist/linux-unpacked/* 2>/dev/null | sort -rh
          echo ""
          echo "=== resources/ ==="
          du -sh dist/linux-unpacked/resources/* 2>/dev/null | sort -rh
          echo ""
          echo "=== ort-web (WASM) ==="
          du -sh dist/linux-unpacked/resources/ort-web
          find dist/linux-unpacked/resources/ort-web \
            -type f -printf '%10s  %P\n' | sort -rn

      # Report 那步只打印、不判红，这里才是门禁，与 mac/windows 的
      # 「Assert packaged tree is usable」对齐：「包内有 onnxruntime-node」是错，
      # 「ort-web 三件套随包」才是对。
      - name: Assert packed ORT is WASM-only
        run: |
          res=dist/linux-unpacked/resources
          if [ -d "$res/app.asar.unpacked/node_modules/onnxruntime-node" ]; then
            echo "::error::onnxruntime-node 仍在包内 —— 依赖切换未完成"
            exit 1
          fi
          for f in ort.node.min.js ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm; do
            if [ ! -f "$res/ort-web/$f" ]; then
              echo "::error::ort-web 运行时未随包：$f"
              exit 1
            fi
          done

      # 只报告、不判红：这个二进制由 Google 的 Chrome for Testing 构建，glibc 下限
      # 我们改不了（既不能重编，也没有更老的 Linux 版本可换）。而它决定「浏览器工具
      # 在 UOS 20 上到底能不能启动」，所以这个数字值得每次打印出来，而不是等到目标机
      # 上 undefined symbol 才被发现。
      - name: Report bundled Chromium glibc floor (informational)
        run: |
          node -e '
            const fs = require("node:fs")
            const { scan, formatVersion } = require("./scripts/check-linux-glibc.js")
            const file = "resources/chromium/chrome-linux/chrome"
            const row = scan([file])[0]
            const shown = row.max ? formatVersion(row.max) : "static (no glibc refs)"
            console.log(`bundled Chromium requires up to GLIBC_${shown} (UOS 20 = 2.28)`)
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `### bundled Chromium glibc floor\n\n\`${file}\` → max GLIBC **${shown}**（目标机 UOS 20 = 2.28）\n`,
              )
            }
          '

      # UOS 等机器的普通用户没有 root：deb 装不了（dpkg -i 要 root），AppImage 又
      # 常缺 libfuse2。同一份 linux-unpacked 再打一个 tar.gz 免安装包——解压后在
      # 解压目录里跑 install.sh 即可（只写家目录、不调 sudo）。与 deb 同源同门禁，
      # 只是两种落地方式；glibc 2.28 那一关上面已经过了。
      - name: Package no-root tarball
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          cp -a dist/linux-unpacked dist/PulseMind
          cp resources/icons-linux/256x256.png dist/icon.png
          cp scripts/install-linux-noroot.sh dist/install.sh
          chmod 755 dist/install.sh
          tar -czf "dist/PulseMind-${version}-linux-x64.tar.gz" -C dist PulseMind install.sh icon.png
          rm -rf dist/PulseMind dist/icon.png dist/install.sh
          ls -lh dist/*.tar.gz

      # 安装器必须在 Linux 上真跑一遍：临时 HOME 装、断言落点、再卸干净。
      # 容器里没有显示服务，不启动 GUI —— 验的是「装到哪、指向哪、卸掉后剩什么」。
      - name: Smoke no-root installer
        run: |
          set -eu
          work=$(mktemp -d)
          tar -xzf dist/PulseMind-*-linux-x64.tar.gz -C "$work"
          test -x "$work/PulseMind/pulsemind"
          test -f "$work/install.sh"
          test -f "$work/icon.png"
          export HOME="$work/home"
          mkdir -p "$HOME"
          ( cd "$work" && sh ./install.sh )
          appdir="$HOME/Applications/PulseMind"
          test -x "$appdir/pulsemind"
          test -f "$appdir/resources/app.asar"
          desktop="$HOME/.local/share/applications/pulsemind.desktop"
          test -f "$desktop"
          grep -Fq "Exec=\"$appdir/pulsemind\"" "$desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/pulsemind.png"
          ( cd "$work" && sh ./install.sh --uninstall )
          test ! -e "$appdir"
          test ! -e "$desktop"
          echo "no-root installer smoke OK"

      - name: Report artifact
        run: |
          ls -lh dist/*.deb dist/*.tar.gz
          sha256sum dist/*.deb dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          # 不能拼 github.ref_name：分支名里的 `/`（如 fix/xxx）会让 upload-artifact
          # 直接判非法（"The artifact name is not valid ... Forward slash /"），构建
          # 明明全绿却在最后一步红掉、产物一个也留不下。与 build-windows.yml 的
          # PulseMind-win-x64-portable 对齐，用不含 ref 的固定名。
          name: pulsemind-deb-x64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          # 与 deb 分成两个 artifact：有 root 的机器下 deb，没有的下 tar.gz，
          # 列表里一眼能分。固定名，理由同上（分支名带 `/` 会让上传直接红）。
          name: pulsemind-linux-x64-tarball
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # deb job 跑在 node:20-bullseye 容器里，而 gh CLI 只装在宿主 runner 上——
  # 容器里执行会 `gh: not found`（exit 127）。所以上传必须另开一个宿主 job：
  # 取回 deb job 刚上传的两个 artifact，再传给 Release。
  upload-release:
    name: upload packages to release
    needs: deb
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 必须与 deb job 的 upload-artifact name 逐字节一致（固定名，见上）。
          name: pulsemind-deb-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: pulsemind-linux-x64-tarball
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "PulseMind ${TAG#v}" --notes "PulseMind ${TAG#v}"
          gh release upload "$TAG" dist/*.deb dist/*.tar.gz --repo "$REPO" --clobber
          echo "release assets: $(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join(", ")')"
