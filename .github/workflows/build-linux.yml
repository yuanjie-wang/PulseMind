# Linux/x64 .deb 打包（目标机：UOS 20 / Debian 10，glibc 2.28）。
#
# better-sqlite3 是 Electron ABI 的原生模块，打进包里的 better_sqlite3.node 必须
# 在 UOS 20（glibc 2.28）上能加载。这一层是四轮 CI 实测钉出来的（2026-11-04/05）：
#   · ubuntu runner（glibc 2.35+）→ .node 引用 GLIBC_2.34，启动即 undefined symbol
#     且构建期毫无提示
#   · bullseye 容器直接编 → 官方 electron-v130 prebuild（WiseLibs 发在新 glibc 上，
#     要求 GLIBC_2.29）被 @electron/rebuild 静默装进去 —— 它的 prebuild 路径**不做
#     加载校验**，编译机 glibc 根本没机会决定产物
#   · buster 容器（glibc 2.28 与目标机同基线）→ prebuild 在 2.28 上加载失败回落
#     编译，但 buster 的 g++ 8.3 认不得 better-sqlite3 12.9 要求的 -std=c++20
#   · 最终形态：bullseye 容器 + **zig 当编译器**（自带 clang，C++20 没问题），
#     -target x86_64-linux-gnu.2.28 把符号下限精确钉在 2.28；libc++ 静态链接，
#     连 UOS 的 libstdc++ 版本兼容都不用操心
# 所以容器回到 node:20-bullseye（python 3.9 过得了 gyp 的 3.8 语法门；官方镜像
# 没有 buster 变体，而 buster 又养不起 g++ 20/clang），编译完全交给 zig。
# 打包完 scripts/check-linux-glibc.js 把每个 .node 的符号需求重量一遍，
# 超过 2.28 直接红 —— 上游 Electron 33.4.11 linux-x64 本体实测只要 GLIBC_2.25。
#
# **不要在这个容器里跑 apt-get install**（2026-11-04 首次 CI 实测：bullseye 已
# EOL，`apt-get install ca-certificates` 会顺带升级到一个 Debian 已从
# deb.debian.org 摘掉的路径，404，job 在 checkout 之前就红）。工具链（python3/
# make/g++/git/curl）全吃镜像自带，唯一例外是 zig（见步骤注释）。
#
# 两条缓存都是必需的，且都不是省事：
#   · resources/chromium 是 gitignore 的，构建时由 ensure-chromium.js 从
#     Playwright 缓存拷进来；它**刻意永不失败**（缺了只 warn），所以 CI 里不装
#     就等于发一个没有内置 Chromium、浏览器工具静默回落系统 Chrome 的包。
#   · node_modules 必须来自干净 npm ci：afterPack 的 verify-packed-node-modules
#     门禁要求纯安装树（见 AGENTS.md「打包两刀」），不要在 CI 里缓存它。
#
# 架构：只有 x64。arm64/loongarch 要另立 job + 先补 resources/bin/linux-arm64/rg
# （现在 filter `linux-${arch}/**` 匹配空不报错，搜索会静默降级成 grep 兜底），
# 且 GH 的 arm64 runner 只在 ubuntu-24.04-arm 上（公开仓免费）。

name: Build Linux deb

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: linux/x64 deb
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: node:20-bullseye
    env:
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 原生模块的编译器 = zig。容器的 g++ 8.3 认不得 better-sqlite3 12.9 的
      # -std=c++20，而容器 glibc 2.31 编出来的符号又超 2.28 —— zig 的 clang
      # 两个都解决：C++20 没问题，-target 的 glibc 后缀把符号下限精确钉在
      # 2.28（libc++ 还静态链接进 .node，不新增运行时依赖）。gyp 的 make 生成器
      # 从环境读 CC/CXX（gyp/generator/make.py 的 GetEnvironFallback），node-gyp
      # 与 @electron/rebuild 的编译因此都走这里。
      CC: zig cc -target x86_64-linux-gnu.2.28
      CXX: zig c++ -target x86_64-linux-gnu.2.28
      # 官方 prebuild 是在新 glibc 上构建的（node-v115 与 electron-v130 的
      # linux-x64 prebuild 都要求 GLIBC_2.29），prebuild-install 的 electron
      # 路径不做加载校验、node 路径在 2.28 上加载失败才回落 —— 无论哪种，都能
      # 绕过编译侧修复或直接装进旧 glibc 都载不动的二进制。这面旗让
      # prebuild-install 在**下载之前**就退出（bin.js 的 buildFromSource 短路，
      # 两条调用路径都读它），所有原生模块一律现编译。
      npm_config_build_from_source: 'true'
      # Playwright 1.63 的 registry 里 debian11-* 是 void 0（这个发行版被从支持
      # 矩阵里摘了），于是 `playwright-core install chromium` 报
      # "ERROR: Playwright does not support chromium on debian11-x64"。
      # 但 debian12/debian13 与 ubuntu22.04/24.04 那几格指向的是**同一个**
      # `linux64/chrome-linux64.zip` —— 这个 override 只绕开一张支持性表格，不会
      # 换来一个「别的二进制」。必须作用到 `npm run build`：ensure-chromium.js 用
      # executablePath() 走同一张表解析缓存路径，只在 install 步骤设它，build 那
      # 一步就会静默拷不到东西（而 ensure-chromium 永不非零退出）。
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'debian12-x64'
      # 容器只负责打包，从不启动浏览器 —— Chromium 的运行时依赖要在目标机（UOS）
      # 上满足。不跳过这层，Playwright 会拿 debian12 的依赖清单校验容器（缺
      # libgbm/libasound 等一串），而补库的唯一工具 install-deps 走 apt，已因
      # bullseye EOL 不可用（见下面的工具链步骤）。
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: '1'

    steps:
      # 不跑 apt（2026-11-04 首次 CI 实测教训）：python3/make/g++/git/ca-certificates
      # 镜像里全都有，而 bullseye 已 EOL —— `apt-get install ca-certificates` 会
      # 顺带升级到一个 Debian 已从 deb.debian.org 摘掉的路径（Debian-security 的
      # ca-certificates_*~deb11u1 404），job 在 checkout 之前就红。
      # 这里只做存在性断言：上游镜像哪天真的瘦身，会在这里明确报错，而不是在
      # node-gyp 深处抛一堆看不懂的东西。
      - name: Verify build toolchain
        run: |
          node -v
          npm -v
          for tool in python3 make git curl tar xz; do
            command -v "$tool" > /dev/null || { echo "missing build tool: $tool"; exit 1; }
          done
          python3 --version

      # 唯一镜像外来的工具。钉 0.13.0（自带 clang 17，C++20 够用；这个版本
      # ziglang.org 的包名还是 arch-last 形态）。解到 /opt/zig 并进 PATH ——
      # 上面 job 级 env 的 CC/CXX 要靠它在 npm ci 时可执行。
      - name: Install zig (compiler for native modules)
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ -C /opt
          mv /opt/zig-linux-x86_64-0.13.0 /opt/zig
          echo '/opt/zig' >> "$GITHUB_PATH"
          # GITHUB_PATH 只对后续步骤生效，本步骤里用全路径自证
          /opt/zig/zig version

      - uses: actions/checkout@v4

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: /root/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/electron
            /root/.cache/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          node -v
          npm -v
          npm ci

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的设计契约是「永不非零退出」（缺了只 warn，让没有
      # Chromium 的开发机也能打包），代价是**任何**取浏览器失败都会静默变成
      # 「一个没有内置浏览器的包」。CI 里没有这个让步的必要：资源没落下就是红。
      - name: Verify bundled Chromium landed
        run: |
          chrome=resources/chromium/chrome-linux/chrome
          if [ ! -x "$chrome" ]; then
            echo "::error::$chrome missing — ensure-chromium never fails, so this step is the only browser-less-package gate"
            find resources/chromium -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          du -sh resources/chromium
          file "$chrome"

      - name: Package deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Check glibc ceiling of shipped native modules
        run: node scripts/check-linux-glibc.js dist/linux-unpacked --ceiling=2.28

      # 只报告、不判红：这个二进制由 Google 的 Chrome for Testing 构建，glibc 下限
      # 我们改不了（既不能重编，也没有更老的 Linux 版本可换）。而它决定「浏览器工具
      # 在 UOS 20 上到底能不能启动」，所以这个数字值得每次打印出来，而不是等到目标机
      # 上 undefined symbol 才被发现。
      - name: Report bundled Chromium glibc floor (informational)
        run: |
          node -e '
            const fs = require("node:fs")
            const { scan, formatVersion } = require("./scripts/check-linux-glibc.js")
            const file = "resources/chromium/chrome-linux/chrome"
            const row = scan([file])[0]
            const shown = row.max ? formatVersion(row.max) : "static (no glibc refs)"
            console.log(`bundled Chromium requires up to GLIBC_${shown} (UOS 20 = 2.28)`)
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `### bundled Chromium glibc floor\n\n\`${file}\` → max GLIBC **${shown}**（目标机 UOS 20 = 2.28）\n`,
              )
            }
          '

      - name: Report artifact
        run: ls -lh dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: pulsemind-deb-${{ github.ref_name }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
