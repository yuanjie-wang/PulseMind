# macOS/arm64 dmg 打包（Apple Silicon 原生 runner）。
#
# 为什么在 GitHub 上打而不是本机交叉：AGENTS.md「mac x64 dmg 不能在 arm64 宿主上
# 直接产出」记的三个错架构坑（better-sqlite3 / sharp / chromium），根因只有一条
# ——在 arm64 宿主上装出的 node_modules 是 arm64，却要打 x64 包。真机 runner 上
# `npm ci` 装出来的原生件天然是本机架构，那套 `@electron/rebuild -a x64` +
# `npm pack` 补 sharp 的重打配方在这里完全不需要。
#
# 为什么拆成两个文件而不是一份 matrix（build-mac-arm64.yml / build-mac-x64.yml）：
# 单架构失败时能只重跑那一个，不必陪着另一边再烧 20 分钟 mac 计费分钟（10x 倍率）。
#
# 签名：仓库没有 Apple 证书 secrets。app-builder-lib/out/macPackager.js:209-212
# 写明 findIdentity 全落空后走 reportError 再 `return false`，即「跳过签名、照样出
# dmg」。而 arm64 内核要求所有可执行页带有效签名——未签名的 .app 拷到别的机器上
# 会被直接杀掉。所以不用 electron-builder 的一次性打包，改成三拍：
#   1. --dir 先出未签名的 .app
#   2. `codesign --force --deep --sign -` 做 ad-hoc 签名（不需要任何证书）
#   3. --prepackaged 拿这份已签名的 .app 压 dmg，保证 dmg 里躺的是签过的 app
# 代价是多跑一次 electron-builder，换来的是可启动的产物。
#
# 未上 Apple 开发者账号 = 没有公证（notarization）：用户首次打开仍会被 Gatekeeper
# 拦，需要右键「打开」或 `xattr -dr com.apple.quarantine`。这是分发信任链的问题，
# 构建侧无解，要彻底解决得买 $99/年 的 Developer ID。

name: Build macOS dmg (arm64)

on:
  workflow_dispatch:
    inputs:
      # 手动触发时把产物传进哪个 Release（如 v0.5.0）。留空则只上传 artifact。
      release-tag:
        description: '上传产物到该 Release（如 v0.5.0，留空则不上传）'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  # write：要把产物上传到 Release（gh release upload）。
  contents: write

concurrency:
  group: build-mac-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: mac/arm64 dmg
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 目标架构与 `file` 输出里该出现的 Mach-O 架构串。x64 那份是 x86_64。
      ARCH: arm64
      EXPECT_MACHO: arm64
      # 不传 token，也就不会尝试上传任何东西；--publish never 再兜一层。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      # 对齐 build-linux.yml / build-windows.yml 的 node 20。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-mac-${{ env.ARCH }}-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ env.ARCH }}-${{ hashFiles('package-lock.json') }}

      # node_modules 必须来自干净安装：afterPack 的 verify-packed-node-modules
      # 门禁要求纯安装树（AGENTS.md「打包两刀」），不要在 CI 里缓存它。
      # postinstall 会跑 electron-builder install-app-deps，原生模块在这一步按
      # Electron 33 的 ABI 重建成 darwin-arm64。
      - name: Install dependencies
        run: npm ci

      # 本机踩过的三处错架构，逐条固化成门禁。这条是「没有真机就别想打对包」
      # 那类问题的唯一防线：跑完 electron-builder 不等于产物能用。
      - name: Assert native modules target Electron+darwin-arm64
        run: |
          set -euo pipefail

          bin=node_modules/better-sqlite3/build/Release/better_sqlite3.node
          if [ ! -f "$bin" ]; then
            echo "::error::better-sqlite3 二进制缺失 —— postinstall 的重建没跑成"
            exit 1
          fi
          file "$bin"
          if ! file "$bin" | grep -q "$EXPECT_MACHO"; then
            echo "::error::better_sqlite3.node 不是 $EXPECT_MACHO 的 Mach-O（期望 $EXPECT_MACHO）—— Intel/Apple Silicon 上主进程加载 DB 即 dlopen 崩"
            exit 1
          fi

          # sharp 的平台包是 optionalDependencies，npm 按宿主架构装：只有对应
          # 那一格时 file-ops.ts / ocr.ts 才可用。
          sharp="node_modules/@img/sharp-darwin-$ARCH"
          if [ ! -d "$sharp" ]; then
            echo "::error::sharp 的 darwin-$ARCH 变体没装上（@img 下只有 $(ls node_modules/@img 2>/dev/null | tr '\n' ' ')）—— 图片链路会在运行期崩"
            exit 1
          fi
          echo "sharp variant: $sharp"

          wasm=node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
          if [ ! -f "$wasm" ]; then
            echo "::error::onnxruntime-web 的 wasm 引擎缺失 —— OCR 不可用"
            exit 1
          fi

          if [ -d node_modules/onnxruntime-node ]; then
            echo "::error::onnxruntime-node 仍在依赖树 —— 依赖已换成 onnxruntime-web，它只会白胖并带入原生 EP"
            exit 1
          fi

      - name: Fetch bundled Chromium
        run: npm run browsers:install

      - name: Build bundles
        run: npm run build

      # ensure-chromium.js 的契约是「永不非零退出」（缺了只 warn，让没有 Chromium
      # 的开发机也能打包），代价是任何取浏览器失败都会静默变成「一个没有内置浏览器
      # 的包」。CI 里没有这个让步的必要。
      # chrome-mac-arm64 会被归一化成 chrome-mac（NORMALIZED 表），所以断言的是
      # 归一化后的目录；架构则直接 `file` 包内可执行文件——这一条正是本机第三个坑
      # （resources/chromium 是 arm64 CFT 而打在 x64 包里）的门禁。
      - name: Verify bundled Chromium landed
        run: |
          set -euo pipefail

          if [ -f resources/chromium/.source ]; then
            echo "source marker: $(cat resources/chromium/.source)"
          fi

          bin=$(find resources/chromium/chrome-mac -type f -path '*/Contents/MacOS/*' -print -quit 2>/dev/null || true)
          if [ -z "$bin" ]; then
            echo "::error::resources/chromium/chrome-mac 下找不到 Contents/MacOS 可执行文件 —— ensure-chromium 永不失败，这一步是唯一的无浏览器包门禁"
            find resources/chromium -maxdepth 3 -print 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "chromium binary: $bin"
          file "$bin"
          if ! file "$bin" | grep -q "$EXPECT_MACHO"; then
            echo "::error::随包 Chromium 不是 $EXPECT_MACHO —— 浏览器工具会退化成系统 Chrome/Edge 兜底"
            exit 1
          fi

          # 随包 Chromium 必须自包含。CFT 内部有 5 条相对符号链接（Versions/Current
          # -> 153.0.x），cpSync 默认的 verbatimSymlinks:false 会把它们解析成指向
          # 构建机 Playwright 缓存的绝对路径——包因此依赖那台机器的
          # ~/Library/Caches，且 codesign --deep 会以 "invalid destination for
          # symbolic link in bundle" 拒签（2026-11-07 实测）。
          # 用 find -lname 而不是 case 判断：macOS runner 的 /bin/bash 是 3.2，
          # 它解析 `case … ;;` 位于 $( ) 内会直接报语法错误（本机 3.2.57 实测复现）。
          abs_links=$(find resources/chromium -type l -lname '/*' 2>/dev/null || true)
          if [ -n "$abs_links" ]; then
            echo "::error::随包 Chromium 含指向 bundle 外的绝对符号链接 —— ensure-chromium 的 verbatimSymlinks 丢了？"
            printf '%s\n' "$abs_links"
            exit 1
          fi
          echo "chromium symlinks: $(find resources/chromium -type l | wc -l | tr -d ' ') 条，全部相对"

      # 第一拍：--dir 只解包不压盘，拿到可签名的 .app。
      - name: Package app dir
        run: |
          set -euo pipefail
          npx electron-builder --mac --"$ARCH" --dir --publish never
          app=$(find dist -maxdepth 2 -type d -name 'PulseMind.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::--dir 跑完了但找不到 PulseMind.app"
            ls -la dist || true
            exit 1
          fi
          echo "app=$app"

      # 第二拍：ad-hoc 签名。第三拍要用这份签过名的 app 压 dmg，所以必须把签名
      # 放在打包之前——反过来（先 dmg 再签）改不到 dmg 里的东西。
      - name: Ad-hoc sign the app
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name 'PulseMind.app' -print -quit)

          # 不给 --options runtime：ad-hoc + hardened runtime 会要求 Electron 的
          # JIT entitlement，而 ad-hoc 签名带不上 entitlements 的完整信任链，
          # 反而更容易起不来。这里只要「有签名」这一条满足内核要求。
          codesign --force --deep --sign - "$app"

          codesign --verify --deep --strict --verbose=2 "$app"
          # 必须看到 Signature=adhoc；code object is not signed at all 就是失败。
          codesign -dv --verbose=2 "$app" 2>&1 | head -15
          if ! codesign -dv "$app" 2>&1 | grep -qE 'Signature=(adhoc|Authority)'; then
            echo "::error::签名没落上 —— arm64 上这样的 app 拷到别的机器会被内核直接杀"
            exit 1
          fi

          file "$app/Contents/MacOS/PulseMind"
          if ! file "$app/Contents/MacOS/PulseMind" | grep -q "$EXPECT_MACHO"; then
            echo "::error::主可执行文件不是 $EXPECT_MACHO"
            exit 1
          fi

      # 第三拍：用已签名的 app 压 dmg。--prepackaged 跳过重新打包，签名得以保留。
      - name: Package dmg from signed app
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name 'PulseMind.app' -print -quit)
          npx electron-builder --mac --prepackaged "$app" --publish never
          ls -lh dist/*.dmg

      # afterPack 删掉了执行提供器库与异平台二进制。文件存在 ≠ 能加载：这里拿
      # 打包后的 onnxruntime 真建 det/rec/cls 三个会话。smoke 脚本自己会处理
      # <out>/PulseMind.app/Contents/Resources 这个 mac 特有的层级。
      - name: Smoke packed OCR runtime
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name 'PulseMind.app' -print -quit)
          node scripts/smoke-packed-ocr.js --app-out "$(dirname "$app")" --platform darwin --arch "$ARCH"

      - name: Assert packaged tree is usable
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name 'PulseMind.app' -print -quit)
          res="$app/Contents/Resources"

          if [ ! -f "$res/app.asar" ]; then
            echo "::error::app.asar 缺失"
            exit 1
          fi
          ls -lh "$res/app.asar"

          # OCR 模型走全局 extraResources → Resources/ocr-models
          for m in det.onnx rec.onnx cls.onnx keys.txt; do
            if [ ! -f "$res/ocr-models/$m" ]; then
              echo "::error::OCR 模型未随包：$m"
              exit 1
            fi
          done
          du -sh "$res/ocr-models"

          # 依赖已从 onnxruntime-node（原生）换成 onnxruntime-web（纯 WASM）：
          # 「包内有 onnxruntime-node」才是错。
          if [ -d "$res/app.asar.unpacked/node_modules/onnxruntime-node" ]; then
            echo "::error::onnxruntime-node 仍在包内 —— 依赖切换未完成"
            exit 1
          fi
          for f in ort.node.min.js ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm; do
            if [ ! -f "$res/ort-web/$f" ]; then
              echo "::error::ort-web 运行时未随包：$f"
              exit 1
            fi
          done

          # rg：平台段 extraResources 的 filter 是 darwin-${arch}/**，缺了不报错
          rg="$res/bin/darwin-$ARCH/rg"
          if [ ! -f "$rg" ]; then
            echo "::error::内置 rg 未随包（搜索会静默降级成 grep 兜底）"
            exit 1
          fi
          file "$rg"
          if ! file "$rg" | grep -q "$EXPECT_MACHO"; then
            echo "::error::随包 rg 不是 $EXPECT_MACHO"
            exit 1
          fi

      # 端到端：dmg 是最终交给用户的东西，挂上去看里面那份 app 的架构与签名，
      # 才算证明「用户拿到手能启动」。上面的断言都只在 dist/ 的中间产物上做。
      - name: Verify dmg contents
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -1)
          ls -lh "$dmg"
          hdiutil verify "$dmg"

          mp="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$mp"
          hdiutil attach -readonly -nobrowse -mountpoint "$mp" "$dmg" >/dev/null
          # detach 必须发生，否则 runner 收尾时 dmg 还挂着会报占用
          trap 'hdiutil detach "$mp" -quiet || true' EXIT

          app=$(find "$mp" -maxdepth 2 -name 'PulseMind.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::dmg 里找不到 PulseMind.app"
            ls -la "$mp"
            exit 1
          fi
          file "$app/Contents/MacOS/PulseMind"
          if ! file "$app/Contents/MacOS/PulseMind" | grep -q "$EXPECT_MACHO"; then
            echo "::error::dmg 内 app 架构不对（期望 $EXPECT_MACHO）"
            exit 1
          fi
          codesign -dv --verbose=2 "$app" 2>&1 | head -10
          if ! codesign -dv "$app" 2>&1 | grep -qE 'Signature=(adhoc|Authority)'; then
            echo "::error::dmg 内 app 没有签名 —— arm64 上用户双击打不开"
            exit 1
          fi
          echo "DMG-OK"

      - name: Report artifact
        run: ls -lh dist/*.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: PulseMind-mac-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # 把产物挂进 GitHub Release。artifact 只保 14 天，Release 是永久的；且构建机
      # 在 GitHub 内网，上传比「本地下载再上传」快几个数量级（本地实测 42KB/s）。
      # 触发：push v* tag，或手动触发时填了 release-tag。Release 不存在则顺手建。
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "PulseMind ${TAG#v}" --notes "PulseMind ${TAG#v}"
          gh release upload "$TAG" dist/*.dmg --repo "$REPO" --clobber
          echo "release assets: $(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join(", ")')"
