<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseMind</title>
    <!-- CSP (review 2026-09-25 P1): script-src deliberately has NO
         'unsafe-inline' — inline scripts (this file's own boot script, an
         injected payload) never run. The boot script lives in
         public/platform-boot.js and loads below as a classic external
         script. The HTML artifact cards and tool-studio previews cannot use
         srcdoc — it inherits this CSP — and blob: is no better: MEASURED in
         scripts/probe-csp-inheritance.mjs (blob child fires load, inline
         script refused — the creator's policy applies), so both frames serve
         a `local-file:` URL over a tmp copy instead; local-file: is the
         app's own protocol and does not inherit (the preview pane has always
         run its pages' scripts through it). `frame-src` therefore carries
         local-file: and nothing else. style-src keeps 'unsafe-inline':
         antd cssinjs injects <style> elements. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: local-file: http: https:; connect-src 'self' http://localhost:* https:; font-src 'self' data:; frame-src local-file:; object-src 'none'">
    <script src="./platform-boot.js"></script>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-variant-emoji: text;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Theme ground (PLAN-dark-mode M1). The variable sheet is injected by
           theme/dom.ts installThemeVars() before React mounts; the literal is
           the fallback for the frames before that (light is the default). */
        background-color: var(--pm-bg, #ffffff);
      }

      /* Windows: disable expensive backdrop-filter blur effects.
         macOS has hardware-accelerated Core Animation blur — Windows does not.
         Compensate frosted-glass panels with more opaque backgrounds. */
      html[data-platform='win32'] * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      /* Remove default focus outline on click; keyboard focus uses focus-visible.
         Tab navigation is globally disabled (see App.tsx), so this is safe. */
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: none;
      }

      /* Global thin scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.6);
      }

      /* Auto-hiding scrollbar. The global rule above turns every scrollbar into
         a classic one, so macOS stops using its own auto-hiding overlay bar and
         the track is always painted. This utility hides the thumb while the
         pointer is elsewhere and reveals it on hover — or when focus is inside
         the area, so keyboard scrolling still has the affordance. The 6px
         gutter stays reserved either way, so nothing shifts when it appears. */
      .auto-hide-scroll::-webkit-scrollbar-thumb {
        background: transparent;
      }
      .auto-hide-scroll:hover::-webkit-scrollbar-thumb,
      .auto-hide-scroll:focus-within::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.4);
      }
      .auto-hide-scroll:hover::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.6);
      }

      /* Header icon button (the app's own idiom; macOS keeps it): a borderless
         28px icon, no background in any state — the open state reads from the
         darker icon colour alone. Lives here rather than in AppLayout's inline
         <style> because the popout window renders PopoutApp, NOT AppLayout, and
         still needs this class for its header (found by probe-popout-boot:
         the popout's button was unstyled on macOS). */
      .header-pane-btn {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        color: var(--pm-text-muted) !important;
        width: 28px !important;
        height: 28px !important;
        padding: 0 !important;
        border-radius: 6px !important;
      }
      .header-pane-btn .ant-btn-icon {
        margin-inline-end: 0 !important;
      }
      .header-pane-btn:hover {
        background: transparent !important;
        color: var(--pm-ink) !important;
      }
      .header-pane-btn.on,
      .header-pane-btn.on:hover {
        background: transparent !important;
        color: var(--pm-ink) !important;
      }

      /* Top-right header actions, styled as Windows/Linux caption buttons
         (user ruling 2026-10-30: 风格尽量贴近 windows/linux 的窗口按钮). They sit
         directly beside the OS-drawn min/max/close, which occupy the same 56px
         strip (titleBarOverlay.height = TITLE_BAR_HEIGHT), so matching footprint
         and hover makes the two clusters read as one row. Values come from
         shared/window-chrome's resolveCaptionButtonStyle via the --pm-caption-*
         custom properties the component sets on the cluster — the symbol colour
         in particular is the SAME value the OS draws with, so the glyphs match
         rather than merely rhyme. macOS never gets this class (its traffic
         lights are on the left; the app's rounded icon button is the right
         idiom there). */
      .pm-caption-btn {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        width: var(--pm-caption-btn-width, 46px) !important;
        height: var(--pm-caption-btn-height, 56px) !important;
        padding: 0 !important;
        color: var(--pm-caption-symbol, #333333) !important;
      }
      .pm-caption-btn .ant-btn-icon {
        margin-inline-end: 0 !important;
      }
      /* Double-class stacking, the house remedy for antd's runtime-injected
         cssinjs: `.ant-btn:hover` is (0,2,0) and lands LATER in <head>, so an
         equal-specificity rule loses the tie whatever the !important — the
         doubled class takes the hover/active/on states to (0,3,0). */
      .pm-caption-btn.pm-caption-btn:hover {
        background: var(--pm-caption-hover, #e5e5e5) !important;
        color: var(--pm-caption-symbol, #333333) !important;
      }
      .pm-caption-btn.pm-caption-btn:active {
        background: var(--pm-caption-active, #d6d6d6) !important;
      }
      .pm-caption-btn.pm-caption-btn.on,
      .pm-caption-btn.pm-caption-btn.on:hover {
        background: var(--pm-caption-hover, #e5e5e5) !important;
        color: var(--pm-caption-symbol, #333333) !important;
      }

      /* Message action row (MessageGroup) responsive collapse — 2026-10-31 user
         ruling: in narrow columns the token/duration stats stay fully visible;
         the action buttons yield instead. The row is a size container; the
         inline buttons and the ⋯ overflow trigger are BOTH always mounted and
         these queries decide who is visible:
           ≥440px   all five buttons inline, ⋯ hidden (the old row untouched)
           360–439  下载/点赞/存为日常任务 → ⋯ (inline 复制+收藏)
           <360px   收藏 also → ⋯ (inline 复制+⋯; the chat column's floor is 320px)
         The Dropdown mounts its overlay INSIDE the row (getPopupContainer on the
         trigger's parent) so the same container queries govern the menu items —
         the 收藏 item exists only in the narrowest tier, where its inline
         button is hidden. !important is required throughout: the buttons carry
         inline display:inline-flex, which beats any plain stylesheet rule. */
      .pm-msg-actions {
        container-type: inline-size;
      }
      .pm-msg-overflow {
        display: none !important;
      }
      @container (max-width: 439px) {
        .pm-msg-actions .pm-msg-btn-collapse {
          display: none !important;
        }
        .pm-msg-actions .pm-msg-overflow {
          display: inline-flex !important;
        }
      }
      @container (min-width: 360px) {
        .pm-msg-actions .pm-msg-menu-fav {
          display: none !important;
        }
      }
      @container (max-width: 359px) {
        .pm-msg-actions .pm-msg-btn-fav {
          display: none !important;
        }
      }

      /* 用户气泡悬停工具条 (2026-11-05): 复制 / 重发. Hidden by OPACITY only —
         the row stays mounted at a fixed 22px, so revealing it never pushes the
         transcript down (the mount-on-hover version jumped a row every time the
         pointer crossed a bubble). :focus-within keeps the buttons reachable by
         keyboard; (hover: none) shows them outright on touch, where there is no
         hover to reveal anything. The hover scope is the whole message block
         (.pm-user-msg), so the gap between bubble and row stays part of it. */
      .pm-user-tools {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .pm-user-msg:hover .pm-user-tools,
      .pm-user-msg:focus-within .pm-user-tools {
        opacity: 1;
        pointer-events: auto;
      }
      .pm-user-tools button:hover {
        color: var(--pm-ink);
      }
      @media (hover: none) {
        .pm-user-tools {
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
