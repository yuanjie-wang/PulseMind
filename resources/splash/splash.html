<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseMind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    overflow: hidden;
  }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 5%, rgba(255,255,255,0) 30%);
  }

  .logo {
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
  }

  .brand {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    margin-bottom: 36px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }

  .hint {
    font-size: 13px;
    color: #aaa;
  }

  .version {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: #555;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    pointer-events: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <img class="bg" src="./bg.png" alt="">
  <img class="logo" src="./pulseMind-splash.png" alt="PulseMind">
  <div class="brand">PulseMind</div>
  <div class="spinner"></div>
  <div class="hint">正在登录中，请稍候...</div>
  <div class="version" id="version">v0.3.5</div>
  <script>
    // Version is injected by the main process via ?v= (app.getVersion());
    // the hardcoded value is only a fallback for direct file opens.
    const v = new URLSearchParams(location.search).get('v')
    if (v) document.getElementById('version').textContent = 'v' + v
  </script>
</body>
</html>
