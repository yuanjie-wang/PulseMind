<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化</title><style>
:root {
  --bg:#f6f7f9; --bg-soft:#eef0f3; --card:#fff; --fg:#1f2329; --muted:#8a9099; --border:#e6e8eb;
  --accent:#389e0d; --accent-soft:rgba(56,158,13,.1); --on-accent:#fff;
  --ok:#389e0d; --ok-soft:rgba(82,196,26,.12); --danger:#d4380d; --danger-soft:rgba(212,56,13,.09);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#141414; --bg-soft:#26282c; --card:#1f1f1f; --fg:#e8eaed; --muted:#8f959e; --border:#33353a;
    --accent:#5cb85c; --accent-soft:rgba(92,184,92,.16); --on-accent:#fff;
    --ok:#6dd66d; --ok-soft:rgba(109,214,109,.14); --danger:#ff7875; --danger-soft:rgba(255,120,117,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 900px; margin: 20px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btns button { border: 1px solid transparent; border-radius: 9px; padding: 8px 16px; cursor: pointer; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 13px; font-weight: 600; transition: filter .15s, border-color .15s, color .15s, transform .06s; }
.btns button:hover { filter: brightness(1.06); }
.btns button:active { transform: scale(.96); }
.btns button.ghost { background: var(--card); color: var(--fg); border-color: var(--border); }
.btns button.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btns .tip { margin-left: auto; font-size: 12px; color: var(--muted); }
/* 校验结果是一枚状态胶囊,而不是一行裸文字 */
.msg { align-self: flex-start; font-size: 12.5px; font-weight: 500; min-height: 20px; padding: 3px 12px; border-radius: 999px; }
.msg:empty { padding: 0; }
.ok { color: var(--ok); background: var(--ok-soft); }
.bad { color: var(--danger); background: var(--danger-soft); }
textarea { width: 100%; min-height: 340px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.65; resize: vertical; transition: border-color .15s, box-shadow .15s; }
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea::placeholder { color: var(--muted); }
</style></head><body>
<div class="wrap">
  <div class="btns">
    <button onclick="fmt(2)">格式化</button>
    <button class="ghost" onclick="fmt(4)">4 空格缩进</button>
    <button class="ghost" onclick="minify()">压缩</button>
    <button class="ghost" onclick="copyOut()">复制结果</button>
    <button class="ghost" onclick="document.getElementById('io').value=''; setMsg('','')">清空</button>
    <span class="tip">⌘/Ctrl + Enter 格式化</span>
  </div>
  <div class="msg" id="msg"></div>
  <textarea id="io" placeholder='粘贴 JSON，例如 {"a":1,"b":[2,3]}'></textarea>
</div>
<script>
let lastOut = '';
function setMsg(text, cls) { const el = document.getElementById('msg'); el.textContent = text; el.className = 'msg ' + cls; }
function fmt(indent) {
  const v = document.getElementById('io').value.trim();
  if (!v) return setMsg('请先粘贴 JSON', 'bad');
  try {
    lastOut = JSON.stringify(JSON.parse(v), null, indent);
    document.getElementById('io').value = lastOut;
    setMsg('✓ 合法 JSON，已格式化', 'ok');
  } catch (e) { setMsg('✗ 解析失败：' + e.message, 'bad'); }
}
function minify() {
  const v = document.getElementById('io').value.trim();
  try { lastOut = JSON.stringify(JSON.parse(v)); document.getElementById('io').value = lastOut; setMsg('✓ 已压缩', 'ok'); }
  catch (e) { setMsg('✗ 解析失败：' + e.message, 'bad'); }
}
async function copyOut() {
  try { await navigator.clipboard.writeText(lastOut || document.getElementById('io').value); setMsg('已复制', 'ok'); }
  catch (e) { try { await window.pulsemind.system.clipboard.writeText(lastOut); setMsg('已复制', 'ok'); } catch (e2) { setMsg('复制失败', 'bad'); } }
}
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') fmt(2); });
</script></body></html>
