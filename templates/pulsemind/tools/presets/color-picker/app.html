<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取色器</title><style>
:root {
  --bg:#f6f7f9; --bg-soft:#eef0f3; --card:#fff; --fg:#1f2329; --muted:#8a9099; --border:#e6e8eb;
  --accent:#722ed1; --accent-soft:rgba(114,46,209,.1); --on-accent:#fff;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#141414; --bg-soft:#26282c; --card:#1f1f1f; --fg:#e8eaed; --muted:#8f959e; --border:#33353a;
    --accent:#a369ea; --accent-soft:rgba(163,105,234,.18); --on-accent:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 420px; margin: 24px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
/* 预览即按钮:点一下复制当前色,角标提示可点 */
.preview { position: relative; height: 140px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: transform .12s, box-shadow .15s; }
.preview:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,24,40,.12); }
.preview:active { transform: translateY(0) scale(.99); }
.preview .tag { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-family: ui-monospace, Menlo, monospace; padding: 3px 10px; border-radius: 999px; backdrop-filter: blur(4px); }
.row { display: flex; align-items: center; gap: 10px; }
input[type=color] { width: 56px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 2px; cursor: pointer; }
.row span { font-size: 13px; color: var(--muted); }
.vals { display: flex; flex-direction: column; gap: 8px; }
.code { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px 9px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; transition: border-color .15s; }
.code:hover { border-color: var(--accent); }
.code b { font-weight: 600; color: var(--muted); font-family: inherit; margin-right: 8px; font-size: 12px; }
.code button { border: none; border-radius: 8px; padding: 5px 12px; cursor: pointer; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; transition: filter .15s, transform .06s; }
.code button:hover { filter: brightness(1.05); }
.code button:active { transform: scale(.95); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
.sw { height: 30px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); transition: transform .12s, box-shadow .12s; }
.sw:hover { transform: scale(1.1); box-shadow: 0 2px 8px rgba(16,24,40,.18); z-index: 1; }
.sw:active { transform: scale(1.02); }
</style></head><body>
<div class="wrap">
  <div class="preview" id="preview" title="点击复制 HEX"><span class="tag" id="tag"></span></div>
  <div class="row"><input type="color" id="picker" value="#3366ff"><span>选一个颜色，或点下面常用色；点色块即可复制</span></div>
  <div class="vals" id="vals"></div>
  <div class="swatches" id="swatches"></div>
</div>
<script>
const COMMON = ['#000000','#ffffff','#f5222d','#fa8c16','#fadb14','#52c41a','#1677ff','#722ed1'];
let hex = '#3366ff';
async function copy(text) {
  try { await window.pulsemind.system.clipboard.writeText(text); flash('已复制 ' + text); }
  catch (e) {
    try { await navigator.clipboard.writeText(text); flash('已复制 ' + text); }
    catch (e2) { flash('复制失败（剪贴板桥不可用）'); }
  }
}
function flash(msg) {
  const tip = document.createElement('div');
  tip.textContent = msg; tip.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--card);padding:8px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2)';
  document.body.appendChild(tip); setTimeout(() => tip.remove(), 1600);
}
function render() {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const preview = document.getElementById('preview');
  preview.style.background = hex;
  document.getElementById('tag').textContent = hex.toUpperCase();
  preview.onclick = () => copy(hex.toUpperCase());
  const vals = document.getElementById('vals');
  vals.innerHTML = '';
  [['HEX', hex], ['RGB', `rgb(${r}, ${g}, ${b})`], ['HSL', (() => {
    const rr=r/255, gg=g/255, bb=b/255, mx=Math.max(rr,gg,bb), mn=Math.min(rr,gg,bb); let h=0,s=0,l=(mx+mn)/2;
    if (mx!==mn) { const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h = mx===rr ? (gg-bb)/d+(gg<bb?6:0) : mx===gg ? (bb-rr)/d+2 : (rr-gg)/d+4; h/=6; }
    return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
  })()]].forEach(([label, value]) => {
    const row = document.createElement('div'); row.className = 'code';
    row.innerHTML = `<span><b>${label}</b>${value}</span>`;
    const btn = document.createElement('button'); btn.textContent = '复制'; btn.onclick = () => copy(value);
    row.appendChild(btn); vals.appendChild(row);
  });
  document.getElementById('picker').value = hex;
}
document.getElementById('picker').oninput = e => { hex = e.target.value; render(); };
const sw = document.getElementById('swatches');
COMMON.forEach(c => {
  const d = document.createElement('div'); d.className = 'sw'; d.style.background = c; d.title = c;
  d.onclick = () => { hex = c; render(); }; sw.appendChild(d);
});
render();
</script></body></html>
