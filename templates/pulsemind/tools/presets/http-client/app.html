<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 工具</title><style>
:root { --bg:#f5f5f5; --card:#fff; --fg:#222; --muted:#888; --accent:#111; --border:#e5e5e5; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --card:#1f1f1f; --fg:#eee; --muted:#999; --accent:#fff; --border:#333; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

.wrap { max-width: 720px; margin: 20px auto; display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
.row { display: flex; gap: 8px; }
select, input, textarea { background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
input[type=text] { flex: 1; font-family: monospace; }
textarea { width: 100%; min-height: 140px; font-family: monospace; font-size: 13px; resize: vertical; }
button { border: none; border-radius: 8px; padding: 10px 22px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.resp { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 80px; }
.status { font-size: 12px; color: var(--muted); }
.err { color: #cf1322; }
@media (prefers-color-scheme: dark) { .err { color: #ff7875; } }
</style></head><body>
<div class="wrap">
  <div class="row">
    <select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>PATCH</option></select>
    <input type="text" id="url" placeholder="https://api.example.com/v1/users">
    <button onclick="send()">发送</button>
  </div>
  <div><label>请求头（JSON，可选）</label><textarea id="headers" style="min-height:60px" placeholder='{"Authorization": "Bearer xxx"}'></textarea></div>
  <div><label>请求体（JSON，POST/PUT 时）</label><textarea id="body" placeholder='{"name": "test"}'></textarea></div>
  <div><label>响应</label><div class="resp" id="resp">点击「发送」查看响应</div><div class="status" id="status"></div></div>
</div>
<script>
async function send() {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const method = document.getElementById('method').value;
  const respEl = document.getElementById('resp');
  const statusEl = document.getElementById('status');
  let headers = {};
  try { const h = document.getElementById('headers').value.trim(); if (h) headers = JSON.parse(h); } catch (e) {
    respEl.textContent = '请求头不是合法 JSON'; respEl.className = 'resp err'; return;
  }
  const opts = { method, headers };
  if (!['GET','HEAD'].includes(method)) {
    const body = document.getElementById('body').value.trim();
    if (body) { opts.body = body; headers['Content-Type'] = headers['Content-Type'] || 'application/json'; }
  }
  respEl.textContent = '请求中…'; respEl.className = 'resp'; statusEl.textContent = '';
  const started = Date.now();
  try {
    // 优先走应用网络桥（M6，绕过 CORS）；不可用时退回直接 fetch。
    let res;
    if (window.pulsemind) res = await window.pulsemind.http.request({ url, method, headers, body: opts.body });
    else res = await fetch(url, opts).then(async r => ({ status: r.status, headers: Object.fromEntries(r.headers), body: await r.text() }));
    const ms = Date.now() - started;
    let pretty = typeof res.body === 'string' ? res.body : JSON.stringify(res.body, null, 2);
    try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch (e) {}
    respEl.textContent = pretty || '(空)';
    respEl.className = 'resp';
    statusEl.textContent = `${res.status} · ${ms}ms · ${(pretty || '').length} 字符`;
  } catch (e) {
    respEl.textContent = '请求失败：' + e.message + '\n（跨域限制：正式版经由应用网络桥发送；在导出的 HTML 中请直接用浏览器打开同源接口）';
    respEl.className = 'resp err';
    statusEl.textContent = '';
  }
}
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send(); });
</script></body></html>
