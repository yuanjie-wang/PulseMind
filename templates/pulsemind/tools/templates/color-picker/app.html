<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取色器</title><style>
:root { --bg:#f5f5f5; --card:#fff; --fg:#222; --muted:#888; --accent:#111; --border:#e5e5e5; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --card:#1f1f1f; --fg:#eee; --muted:#999; --accent:#fff; --border:#333; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

.wrap { max-width: 420px; margin: 24px auto; display: flex; flex-direction: column; gap: 16px; }
.preview { height: 140px; border-radius: 14px; border: 1px solid var(--border); }
.row { display: flex; gap: 8px; }
input[type=color] { width: 64px; height: 48px; border: none; background: none; cursor: pointer; }
.vals { display: flex; flex-direction: column; gap: 8px; }
.code { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-family: monospace; font-size: 14px; }
button { border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; background: var(--accent); color: var(--bg); font-size: 12px; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sw { height: 32px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
</style></head><body>
<div class="wrap">
  <div class="preview" id="preview"></div>
  <div class="row"><input type="color" id="picker" value="#3366ff"><span style="color:var(--muted);font-size:13px">选一个颜色，或点下面常用色</span></div>
  <div class="vals" id="vals"></div>
  <div class="swatches" id="swatches"></div>
</div>
<script>
const COMMON = ['#000000','#ffffff','#f5222d','#fa8c16','#fadb14','#52c41a','#1677ff','#722ed1'];
let hex = '#3366ff';
async function copy(text) {
  try { await window.pulsemind.system.clipboard.writeText(text); flash('已复制 ' + text); }
  catch (e) {
    try { await navigator.clipboard.writeText(text); flash('已复制 ' + text); }
    catch (e2) { flash('复制失败（剪贴板桥不可用）'); }
  }
}
function flash(msg) {
  const tip = document.createElement('div');
  tip.textContent = msg; tip.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px';
  document.body.appendChild(tip); setTimeout(() => tip.remove(), 1600);
}
function render() {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  document.getElementById('preview').style.background = hex;
  const vals = document.getElementById('vals');
  vals.innerHTML = '';
  [['HEX', hex], ['RGB', `rgb(${r}, ${g}, ${b})`], ['HSL', (() => {
    const rr=r/255, gg=g/255, bb=b/255, mx=Math.max(rr,gg,bb), mn=Math.min(rr,gg,bb); let h=0,s=0,l=(mx+mn)/2;
    if (mx!==mn) { const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h = mx===rr ? (gg-bb)/d+(gg<bb?6:0) : mx===gg ? (bb-rr)/d+2 : (rr-gg)/d+4; h/=6; }
    return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
  })()]].forEach(([label, value]) => {
    const row = document.createElement('div'); row.className = 'code';
    row.innerHTML = `<span>${label}: ${value}</span>`;
    const btn = document.createElement('button'); btn.textContent = '复制'; btn.onclick = () => copy(value);
    row.appendChild(btn); vals.appendChild(row);
  });
  document.getElementById('picker').value = hex;
}
document.getElementById('picker').oninput = e => { hex = e.target.value; render(); };
const sw = document.getElementById('swatches');
COMMON.forEach(c => {
  const d = document.createElement('div'); d.className = 'sw'; d.style.background = c;
  d.onclick = () => { hex = c; render(); }; sw.appendChild(d);
});
render();
</script></body></html>
