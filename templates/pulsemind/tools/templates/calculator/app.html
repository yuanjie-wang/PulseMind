<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title><style>
:root { --bg:#f5f5f5; --card:#fff; --fg:#222; --muted:#888; --accent:#111; --border:#e5e5e5; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --card:#1f1f1f; --fg:#eee; --muted:#999; --accent:#fff; --border:#333; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

.calc { max-width: 340px; margin: 24px auto; background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
.screen { background: var(--bg); border-radius: 10px; padding: 14px; text-align: right; margin-bottom: 12px; }
.expr { color: var(--muted); font-size: 13px; min-height: 18px; word-break: break-all; }
.result { font-size: 32px; font-weight: 700; word-break: break-all; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button { border: none; border-radius: 10px; padding: 14px 0; font-size: 17px; background: var(--bg); color: var(--fg); cursor: pointer; }
button:active { transform: scale(.96); }
.op { background: rgba(0,0,0,.06); }
.eq { background: var(--accent); color: var(--bg); grid-column: span 2; }
@media (prefers-color-scheme: dark) { .op { background: rgba(255,255,255,.08); } }
</style></head><body>
<div class="calc">
  <div class="screen"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div>
  <div class="keys" id="keys"></div>
</div>
<script>
const keys = ['C','(','\u2190','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','%','='];
const grid = document.getElementById('keys');
keys.forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  if ('/*-+()%'.includes(k)) b.className = 'op';
  if (k === '=') b.className = 'eq';
  b.onclick = () => press(k);
  grid.appendChild(b);
});
let expr = '';
function press(k) {
  if (k === 'C') expr = '';
  else if (k === '\u2190') expr = expr.slice(0, -1);
  else if (k === '=') {
    try {
      const safe = expr.replace(/[^0-9+\-*/().%]/g, '');
      const val = Function('"use strict";return (' + safe + ')')();
      expr = String(val);
    } catch (e) { document.getElementById('result').textContent = '错误'; return; }
  } else expr += k;
  document.getElementById('expr').textContent = expr;
  document.getElementById('result').textContent = expr || '0';
}
document.addEventListener('keydown', e => {
  const map = { Enter: '=', Backspace: '\u2190', Escape: 'C' };
  const k = map[e.key] || e.key;
  if (keys.includes(k)) press(k);
});
</script></body></html>
